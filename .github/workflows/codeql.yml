name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  schedule:
    - cron: "0 3 * * MON"

permissions:
  contents: read

jobs:
  code-scan:
    name: Code Scan
    # Permissions must cover what the reusable workflow requests.
    permissions:
      actions: read
      contents: write
      issues: write
      packages: read
      pull-requests: write
      security-events: write
    uses: entur/gha-security/.github/workflows/code-scan.yml@0962fb4f3f9004eeaea88582db8639e140ec6fda # v2.17.1
    secrets: inherit
